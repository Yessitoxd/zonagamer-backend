                <input id="productQuantity" type="number" min="1" value="1" style="width:100%;margin-top:8px;padding:8px;border-radius:8px;border:1px solid #81fde9;background:rgba(255,255,255,0.15);color:#fff;" />

    <script>
    const body = document.body;
    document.addEventListener('DOMContentLoaded', async () => {
        const mainPanel = document.getElementById('mainPanel');
        const usernameDisplay = document.getElementById('usernameDisplay');
        const sidebar = document.getElementById('sidebar');
        const logoutBtn = document.getElementById('logoutBtn');
        window.isOwner = false;
            window.currentUser = null;
        try {
            const alarmEl = document.getElementById('alarm-sound');
            if (alarmEl) {
                alarmSound = alarmEl;
            }
            let audioUnlocked = false;
            const unlockAudioOnce = () => {
                if (audioUnlocked || !alarmSound) return;
                try {
                    alarmSound.muted = true;
                    const p = alarmSound.play();
                    if (p && typeof p.then === 'function') {
                        p.then(() => {
                            alarmSound.pause();
                            alarmSound.currentTime = 0;
                            alarmSound.muted = false;
                            audioUnlocked = true;
                        }).catch(() => {
                        });
                    } else {
                        alarmSound.pause();
                        alarmSound.currentTime = 0;
                        alarmSound.muted = false;
                        audioUnlocked = true;
                    }
                } catch (e) {
                }
            };
            document.addEventListener('pointerdown', unlockAudioOnce, { once: true, capture: true });
        } catch {}
        let employeeName = 'Empleado';
        try {
            const r = await fetch('https://zonagamer-backend.onrender.com/session', { credentials: 'include' });
            if (r.ok) {
                const s = await r.json();
                window.currentUser = s || null;
                if (s && (s.role === 'dueña' || s.username === 'Yesseira')) window.isOwner = true;
                if (s && s.username && (s.role === 'trabajador' || s.role === 'dueña' || s.username === 'Yesseira')) {
                    employeeName = s.username;
                } else {
                    window.location.href = 'Index.html';
                    return;
                }
            } else {
                window.location.href = 'Index.html';
                return;
            }
        } catch {
            window.location.href = 'Index.html';
            return;
        }
        usernameDisplay.textContent = employeeName;
        mainPanel.style.display = 'flex';
        body.style.flexDirection = 'row';
        if (employeeName && employeeName !== 'Empleado') {
            console.log(`¡Bienvenido, ${employeeName}! Autenticación exitosa.`);
        }
        sidebar.style.display = 'none';
        logoutBtn.style.display = 'none';
        usernameDisplay.style.cursor = 'pointer';
        let sidebarVisible = false;
        usernameDisplay.addEventListener('click', () => {
            sidebarVisible = !sidebarVisible;
            if (sidebarVisible) {
                sidebar.style.display = 'flex';
                logoutBtn.style.display = 'block';
            } else {
                sidebar.style.display = 'none';
                logoutBtn.style.display = 'none';
            }
        });
        logoutBtn.onclick = async function() {
            try { await fetch('https://zonagamer-backend.onrender.com/session', { method: 'DELETE', credentials: 'include' }); } catch {}
            window.location.href = 'Index.html';
        };

        try {
            const getDateNicaISO = () => {
                try {
                    return new Date().toLocaleString('sv-SE', { timeZone: 'America/Managua' }).split(' ')[0];
                } catch { return new Date().toISOString().slice(0,10); }
            };
            let lastNicaDate = getDateNicaISO();
            setInterval(() => {
                const nowDate = getDateNicaISO();
                if (nowDate !== lastNicaDate) {
                    lastNicaDate = nowDate;
                    totalEarnings = 0;
                    if (typeof updateEarningsDisplay === 'function') updateEarningsDisplay();
                }
            }, 30000);
        } catch {}
    });


    let transferMode = false;
    let sourceCard = null;
    let totalEarnings = 0;


    let consoles = [];
    let prices = { ps5: [], switch: [] };
    let products = [];
    let employees = [];

    // Cargar datos desde la API REST
    async function fetchConsoles() {
        const res = await fetch('https://zonagamer-backend.onrender.com/consoles');
        consoles = await res.json();
    }
    async function fetchPrices() {
        const res = await fetch('https://zonagamer-backend.onrender.com/prices');
        const pricesArray = await res.json();
        prices = { ps5: [], switch: [] };
        pricesArray.forEach(p => {
            if (p.console && p.duration && typeof p.price !== 'undefined') {
                if (!prices[p.console]) prices[p.console] = [];
                prices[p.console].push({
                    id: p._id || `${p.console}-${p.duration}-${p.price}-${p.label || ''}`,
                    duration: Number(p.duration),
                    price: Number(p.price) || 0,
                    label: (p.label || '').toString().trim()
                });
            }
        });
    }
    async function fetchProducts() {
        const res = await fetch('https://zonagamer-backend.onrender.com/products');
        const list = await res.json().catch(() => []);
        products = Array.isArray(list) ? list : [];
    }
    async function fetchEmployees() {
        const res = await fetch('https://zonagamer-backend.onrender.com/employees');
        employees = await res.json();
    }

    async function saveConsoles(newConsoles) {
        if (!Array.isArray(newConsoles)) {
            await fetch('https://zonagamer-backend.onrender.com/consoles', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(newConsoles)
            });
            await fetchConsoles();
            return;
        }
        const res = await fetch('https://zonagamer-backend.onrender.com/consoles', {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(newConsoles)
        });
        if (res.ok) {
            await fetchConsoles();
        } else {
            console.error('Error saving consoles bulk:', await res.text());
        }
    }
    async function savePrices(newPrices) {
        await fetch('https://zonagamer-backend.onrender.com/prices', {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(newPrices)
        });
        prices = newPrices;
    }
    async function saveEmployees(newEmployees) {
        await fetch('https://zonagamer-backend.onrender.com/employees', {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(newEmployees)
        });
        employees = newEmployees;
    }

        

        function loadAndRenderConsoles() {
            const consoleGrid = document.getElementById('consoleGrid');
            if (!consoleGrid) return;
            consoleGrid.innerHTML = '<div class="transfer-message-global" id="transferMessage">Elige tu nueva consola</div>';
            if (!Array.isArray(consoles) || consoles.length === 0) return;
            consoles.sort((a, b) => a.number - b.number);
            console.log('DEBUG consoles:', consoles);
            console.log('DEBUG prices:', prices);
            consoles.forEach(consoleData => {
                const card = document.createElement('div');

        function formatDuration(minutesInput) {
            const mins = Math.round(parseFloat(minutesInput) * 100) / 100;
            const hours = Math.floor(mins / 60);
            const minutes = Math.round(mins % 60);

            let parts = [];
            if (hours > 0) parts.push(`${hours} hora${hours > 1 ? 's' : ''}`);
            if (minutes > 0) parts.push(`${minutes} minuto${minutes > 1 ? 's' : ''}`);

            if (parts.length === 2) return `${parts[0]} y ${parts[1]}`;
            if (parts.length === 1) return parts[0];
            return '0 minutos';
        }

        function populatePriceSelects(card) {
            const consoleType = card.dataset.consoleType;
            const timeSelect = card.querySelector('.time-select');
            const defaultOption = document.createElement('option');
            defaultOption.value = '';
            defaultOption.disabled = true;
            defaultOption.selected = true;
            defaultOption.textContent = 'Elegir tiempo';
            timeSelect.innerHTML = '';
            timeSelect.appendChild(defaultOption);

            const consolePrices = Array.isArray(prices[consoleType]) ? prices[consoleType] : [];
            consolePrices
                .slice()
                .sort((a, b) => Number(a.duration) - Number(b.duration) || Number(a.price) - Number(b.price))
                .forEach(entry => {
                    const option = document.createElement('option');
                    const secondsValue = Math.round(Number(entry.duration) * 60);
                    // El id evita que dos promociones de la misma duración se sobrescriban.
                    option.value = `${secondsValue}:${entry.id}`;
                    option.dataset.price = Number(entry.price) || 0;
                    option.textContent = `${entry.label || formatDuration(entry.duration)} — C$ ${Number(entry.price) || 0}`;
                    timeSelect.appendChild(option);
                });
            if (window.isOwner) {
                const customOption = document.createElement('option');
                customOption.value = 'custom';

                customOption.textContent = 'Tiempo personalizado';
                timeSelect.appendChild(customOption);
            }

        }

        function normalizeProductImageUrl(value) {
            const url = String(value || '').trim();
            const driveMatch = url.match(/drive\.google\.com\/file\/d\/([^/?#]+)/i) || url.match(/[?&]id=([^&#]+)/i);
            return driveMatch ? `https://drive.google.com/uc?export=view&id=${driveMatch[1]}` : url;
        }
        function updateProductImagePreview(product) {

            if (!preview) return;

            const url = normalizeProductImageUrl(product.imageUrl);
            preview.innerHTML = url

        async function sellSelectedProduct() {
            const select = document.getElementById('productSelect');
            const quantityInput = document.getElementById('productQuantity');
            if (!select || !select.value) {
                alert('Selecciona un producto antes de vender.');
                return;
            }
            const quantity = Math.floor(Number(quantityInput && quantityInput.value ? quantityInput.value : 1));
            if (!quantity || quantity < 1 || !Number.isFinite(quantity)) {
                alert('Cantidad inválida.');
                return;
            }
            const selected = select.options[select.selectedIndex];
            const unitPrice = Number(selected.dataset.price || 0);
            const totalPrice = Number((unitPrice * quantity).toFixed(2));
            const baseDescription = selected.dataset.description || selected.dataset.name || 'Producto';
            const payload = {
                productId: select.value,
                productName: selected.dataset.name || selected.textContent || 'Producto',
                description: baseDescription,
                quantity,
                unitPrice,
                price: totalPrice,
                employee: (window.currentUser && window.currentUser.username) ? window.currentUser.username : ''
            };
            try {
                const res = await fetch('https://zonagamer-backend.onrender.com/product-sales', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    credentials: 'include',
                    body: JSON.stringify(payload)
                });
                if (!res.ok) {
                    const err = await res.json().catch(() => ({}));
                    throw new Error(err.error || 'No se pudo guardar la venta');
                }
                addEarnings(totalPrice);
                select.value = '';
                if (quantityInput) quantityInput.value = '1';
            } catch (e) {
                console.error('Error vendiendo producto:', e);
                alert('No se pudo registrar la venta del producto.');
            }
        }

        async function loadEarnings() {
            try {
                const KEY = 'zg_earnings';
                const DATE_KEY = 'zg_earnings_date';
                const stored = localStorage.getItem(KEY);
                const storedDate = localStorage.getItem(DATE_KEY);
                let todayISO;
                try { todayISO = new Date().toLocaleString('sv-SE', { timeZone: 'America/Managua' }).split(' ')[0]; }
                catch { todayISO = new Date().toISOString().slice(0,10); }

                let loaded = false;
                try {
                    const res = await fetch('https://zonagamer-backend.onrender.com/earnings?date=' + todayISO, { credentials: 'include' });
                    if (res.ok) {
                        const data = await res.json();
                        if (data && typeof data.amount !== 'undefined') {
                            totalEarnings = Number(data.amount) || 0;
                            localStorage.setItem(KEY, String(totalEarnings));
                            localStorage.setItem(DATE_KEY, todayISO);
                            loaded = true;
                        }
                    }
                } catch (e) {
                }

                if (!loaded) {
                    const parsed = parseFloat(stored);
                    totalEarnings = (!isNaN(parsed) ? parsed : 0);

                    if (!storedDate || storedDate !== todayISO) {
                        totalEarnings = 0;
                        localStorage.setItem(KEY, '0');
                        localStorage.setItem(DATE_KEY, todayISO);
                    }
                }
            } catch (e) {
                console.warn('loadEarnings failed', e);
                totalEarnings = 0;
            }
            updateEarningsDisplay();
        }

        function updateEarningsDisplay() {
            totalEarningsDisplay.textContent = `Dinero obtenido: C$ ${totalEarnings}`;
        }

        function addEarnings(price) {
            const newPrice = parseFloat(price);
            if (!isNaN(newPrice)) {
                totalEarnings += newPrice;
                try {
                    const KEY = 'zg_earnings';
                    const DATE_KEY = 'zg_earnings_date';
                    localStorage.setItem(KEY, String(totalEarnings));
                    const todayISO = new Date().toLocaleString('sv-SE', { timeZone: 'America/Managua' }).split(' ')[0];
                    localStorage.setItem(DATE_KEY, todayISO);
                    try {
                        fetch('https://zonagamer-backend.onrender.com/earnings', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            credentials: 'include',
                            body: JSON.stringify({ dateISO: todayISO, amount: totalEarnings })
                        }).catch(() => {});
                    } catch (e) {}
                } catch (e) { console.warn('addEarnings local save failed', e); }
                updateEarningsDisplay();
            }
        }

        function stopAlarmAndShaking(card) {
            if (card.alarmSound) {
                try {
                    card.alarmSound.pause();

                    card.alarmSound.loop = false;

        function formatTime(seconds) {
            if (isNaN(seconds) || seconds < 0) {
                return '0:00:00';
            }
            const hours = Math.floor(seconds / 3600);
            const minutes = Math.floor((seconds % 3600) / 60);
            const remainingSeconds = Math.floor(seconds % 60);
            return `${String(hours).padStart(1, '0')}:${String(minutes).padStart(2, '0')}:${String(remainingSeconds).padStart(2, '0')}`;
        }
        
        function handleTransferClick(event) {
            if (!transferMode || !sourceCard) {
                return;
            }
            const targetCard = event.currentTarget;
            
            const transferDuration = new Date().getTime() - sourceCard.pauseStartTime;
            targetCard.totalSeconds = sourceCard.totalSeconds;
            targetCard.currentSessionEarnings = sourceCard.currentSessionEarnings;
            targetCard.totalPausedTime = sourceCard.totalPausedTime + transferDuration;
            targetCard.elapsedSeconds = sourceCard.elapsedAtPause;
            targetCard.sessionStartTime = new Date().getTime() - (targetCard.elapsedSeconds * 1000) - targetCard.totalPausedTime;
            const selectedTimeValue = sourceCard.querySelector('.time-select').value;
            const targetTimeSelect = targetCard.querySelector('.time-select');
            populatePriceSelects(targetCard);
            targetTimeSelect.value = selectedTimeValue;
            const targetPrice = targetTimeSelect.options[targetTimeSelect.selectedIndex].dataset.price;
            targetCard.querySelector('.price-display').textContent = `C$ ${targetPrice}`;
            targetCard.querySelector('.timer-left').textContent = formatTime(targetCard.elapsedSeconds);
            targetCard.querySelector('.timer-right').textContent = formatTime(targetCard.totalSeconds);
            targetCard.startResetBtns.classList.add('hidden');
            targetCard.pauseResumeBtns.classList.remove('hidden');
            targetCard.querySelector('.pause-btn').classList.add('hidden');
            targetCard.querySelector('.resume-btn').classList.remove('hidden');
            clearInterval(targetCard.intervalId);
            targetCard.pauseStartTime = new Date().getTime();
            targetCard.updateEndTimeDisplay();
            if (typeof targetCard.saveCardState === 'function') targetCard.saveCardState();
            if (typeof sourceCard.saveCardState === 'function') sourceCard.saveCardState();
            targetCard.transferComment = `Cambio de ${sourceCard.dataset.consoleType} #${sourceCard.dataset.consoleNumber} a ${targetCard.dataset.consoleType} #${targetCard.dataset.consoleNumber}`;
            sourceCard.resetCard();
            transferMode = false;
            transferMessage.style.display = 'none';
            document.querySelectorAll('.console-card').forEach(c => {
                c.classList.remove('disabled-card', 'target-mode', 'transfer-mode');
                c.removeEventListener('click', handleTransferClick);
            });
            sourceCard = null;
        }

        function initCardFunctionality(card) {
            card.sessionStartTime = null;
            card.totalSeconds = 0;
            card.intervalId = null;
            card.pauseStartTime = null;
            card.totalPausedTime = 0;
            card.elapsedSeconds = 0;
            card.elapsedAtPause = 0;
            card.currentSessionEarnings = 0;
            try {
                card.alarmSound = alarmSound ? alarmSound.cloneNode() : null;
            } catch (e) {
                card.alarmSound = null;
            }

            card.startResetBtns = card.querySelector('.start-reset-btns');
            card.pauseResumeBtns = card.querySelector('.pause-resume-btns');
            card.endBtns = card.querySelector('.end-btns');
            card.transferBtns = card.querySelector('.transfer-btns');
            card.transferShroud = card.querySelector('.transfer-shroud');

            const startBtn = card.querySelector('.start-btn');
            const resetBtn = card.querySelector('.reset-btn');
            const pauseBtn = card.querySelector('.pause-btn');
            const resumeBtn = card.querySelector('.resume-btn');
            const endSessionBtn = card.querySelector('.end-session-btn');
            const endEarlyBtn = card.querySelector('.end-early-btn');
            const addTimeBtn = card.querySelector('.add-time-btn');
            const changeConsoleBtn = card.querySelector('.change-console-btn');
            const cancelTransferBtn = card.querySelector('.cancel-transfer-btn');

            const timeSelect = card.querySelector('.time-select');
            const timeLeftDisplay = card.querySelector('.timer-left');
            const timeRightDisplay = card.querySelector('.timer-right');
            const progressBar = card.querySelector('.progress-bar');
            const endTimeDisplay = card.querySelector('.end-time-display');

            populatePriceSelects(card);

            function getDateNicaISO() {
                try {
                    return new Date().toLocaleString('sv-SE', { timeZone: 'America/Managua' }).split(' ')[0];
                } catch (e) { return new Date().toISOString().slice(0,10); }
            }
            let lastStateSaveAt = 0;
            const SAVE_EVERY_MS = 5000;
            async function saveCardState() {
                const state = {
                    sessionStartTime: card.sessionStartTime,
                    totalSeconds: card.totalSeconds,
                    totalPausedTime: card.totalPausedTime,
                    elapsedSeconds: card.elapsedSeconds,
                    elapsedAtPause: card.elapsedAtPause,
                    pauseStartTime: card.pauseStartTime,
                    currentSessionEarnings: card.currentSessionEarnings,
                    timeSelectValue: timeSelect.value,
                    priceDisplay: card.querySelector('.price-display').textContent,
                    savedAt: Date.now(),
                    dayISO: getDateNicaISO(),
                    ui: {
                        startReset: !card.startResetBtns.classList.contains('hidden'),
                        pauseResume: !card.pauseResumeBtns.classList.contains('hidden'),
                        endBtns: !card.endBtns.classList.contains('hidden'),
                        transferBtns: !card.transferBtns.classList.contains('hidden'),
                        pauseBtn: !pauseBtn.classList.contains('hidden'),
                        resumeBtn: !resumeBtn.classList.contains('hidden')
                    }
                };
                try {
                    await fetch(`https://zonagamer-backend.onrender.com/console-state/${card.dataset.consoleNumber}`,
                        {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ state })
                        }
                    );
                } catch (e) {
                    console.error('Error guardando estado de consola en backend:', e);
                }
            }
            card.saveCardState = saveCardState;
            function saveCardStateThrottled(force = false) {
                const now = Date.now();
                if (!force && (now - lastStateSaveAt) < SAVE_EVERY_MS) return;
                lastStateSaveAt = now;
                saveCardState();
            }
            async function loadCardState() {
                try {
                    const res = await fetch(`https://zonagamer-backend.onrender.com/console-state/${card.dataset.consoleNumber}`);
                    if (!res.ok) return;
                    const state = await res.json();
                    if (!state) return;
                    const todayNica = getDateNicaISO();
                    if (state.dayISO && state.dayISO !== todayNica) {
                        return;
                    }
                    card.sessionStartTime = state.sessionStartTime;
                    card.totalSeconds = state.totalSeconds;
                    card.totalPausedTime = state.totalPausedTime;
                    card.elapsedSeconds = state.elapsedSeconds;
                    card.elapsedAtPause = state.elapsedAtPause;
                    card.pauseStartTime = state.pauseStartTime;
                    card.currentSessionEarnings = state.currentSessionEarnings;
                    timeSelect.value = state.timeSelectValue || '';
                    card.querySelector('.price-display').textContent = state.priceDisplay || 'C$ 0';
                    if (state.ui && state.sessionStartTime && state.totalSeconds > 0) {
                        card.startResetBtns.classList.toggle('hidden', !state.ui.startReset);
                        card.pauseResumeBtns.classList.toggle('hidden', !state.ui.pauseResume);
                        card.endBtns.classList.toggle('hidden', !state.ui.endBtns);
                        card.transferBtns.classList.toggle('hidden', !state.ui.transferBtns);
                        pauseBtn.classList.toggle('hidden', !state.ui.pauseBtn);
                        resumeBtn.classList.toggle('hidden', !state.ui.resumeBtn);
                    }
                } catch (e) {
                    console.error('Error al cargar el estado de la consola desde backend:', e);
                }
            }

            card.stopAlarmAndShaking = function() {
                if (this.alarmSound) {
                    try {
                        this.alarmSound.pause();
                        this.alarmSound.currentTime = 0;
                        this.alarmSound.loop = false;
                    } catch (e) { console.warn('alarm stop failed', e); }
                }
                this.classList.remove('shaking');
            }

            card.startNewSession = function(totalSecs, currentEarnings) {
                card.stopAlarmAndShaking(); 
                card.totalSeconds = parseInt(totalSecs);
                card.currentSessionEarnings = currentEarnings;
                card.sessionStartTime = new Date().getTime();
                card.totalPausedTime = 0;
                card.elapsedSeconds = 0;
                const formattedTime = formatTime(card.totalSeconds);
                timeLeftDisplay.textContent = '0:00:00';
                timeRightDisplay.textContent = formattedTime;
                card.updateEndTimeDisplay();
                clearInterval(card.intervalId);
                card.intervalId = setInterval(card.checkTimeAndAct, 500);
                card.startResetBtns.classList.add('hidden');
                card.pauseResumeBtns.classList.remove('hidden');
                card.endBtns.classList.add('hidden');
                pauseBtn.classList.remove('hidden');
                resumeBtn.classList.add('hidden');
                saveCardStateThrottled(true);
            }


            card.checkTimeAndAct = function() {
                const now = new Date().getTime();
                const elapsedActiveTime = (now - card.sessionStartTime - card.totalPausedTime) / 1000;
                const remainingTime = card.totalSeconds - elapsedActiveTime;
                if (remainingTime <= 0) {
                    clearInterval(card.intervalId);
                    card.pauseResumeBtns.classList.add('hidden');
                    card.endBtns.classList.remove('hidden');
                    card.startResetBtns.classList.add('hidden');
                    card.classList.add('shaking');
                    if (card.alarmSound) {
                        try { card.alarmSound.loop = true; card.alarmSound.play(); } catch (e) { console.warn('alarm play failed', e); }
                    }
                }
                card.elapsedSeconds = Math.min(card.totalSeconds || 0, Math.max(0, Math.floor(elapsedActiveTime)));
                timeLeftDisplay.textContent = formatTime(card.elapsedSeconds);
                timeRightDisplay.textContent = formatTime(card.totalSeconds);
                progressBar.style.width = `${(card.elapsedSeconds / (card.totalSeconds || 1)) * 100}%`;
                saveCardStateThrottled();
            };

            card.updateEndTimeDisplay = function() {
                if (card.sessionStartTime && card.totalSeconds > 0) {
                    const elapsedActiveTime = (new Date().getTime() - card.sessionStartTime - card.totalPausedTime) / 1000;
                    const remainingDuration = (card.totalSeconds - elapsedActiveTime) * 1000;
                    const endTime = new Date(Date.now() + remainingDuration);
                    const prefers12h = /am|pm/i.test(new Date().toLocaleTimeString());
                    const ts = endTime.toLocaleTimeString(undefined, { hour: 'numeric', minute: '2-digit', second: '2-digit', hour12: prefers12h });
                    endTimeDisplay.textContent = `Termina a las ${ts}`;
                } else {
                    endTimeDisplay.textContent = '';
                }
            };

            card.resetCard = function() {
                clearInterval(card.intervalId);
                card.stopAlarmAndShaking();
                timeLeftDisplay.textContent = '0:00:00';
                timeRightDisplay.textContent = '0:00:00';
                progressBar.style.width = '0%';
                endTimeDisplay.textContent = '';
                card.startResetBtns.classList.remove('hidden');
                card.pauseResumeBtns.classList.add('hidden');
                card.endBtns.classList.add('hidden');
                card.transferBtns.classList.add('hidden');
                timeSelect.value = "";
                card.querySelector('.price-display').textContent = `C$ 0`;
                delete card.dataset.overridePrice;
                card.sessionStartTime = null;
                card.totalSeconds = 0;
                card.elapsedSeconds = 0;
                card.pauseStartTime = null;
                card.totalPausedTime = 0;
                card.elapsedAtPause = 0;
                card.currentSessionEarnings = 0;
                card.classList.remove('transfer-mode', 'target-mode', 'disabled-card');
                card.removeEventListener('click', handleTransferClick);
                try { fetch(`https://zonagamer-backend.onrender.com/console-state/${card.dataset.consoleNumber}`, { method: 'DELETE' }); } catch (e) {}
            }

            ;(async () => {
                await loadCardState();
                if (card.sessionStartTime && card.totalSeconds > 0) {
                    const now = Date.now();
                    const isPaused = !!card.pauseStartTime;
                    const elapsedActiveTime = (now - card.sessionStartTime - (card.totalPausedTime || 0)) / 1000;
                    const overdueMs = (elapsedActiveTime - card.totalSeconds) * 1000;
                    if (elapsedActiveTime >= card.totalSeconds) {
                        if (overdueMs > 2 * 60 * 1000) {
                            card.resetCard();
                            return;
                        }
                        card.elapsedSeconds = Math.floor(card.totalSeconds);
                        timeLeftDisplay.textContent = formatTime(card.elapsedSeconds);
                        timeRightDisplay.textContent = formatTime(card.totalSeconds);
                        progressBar.style.width = '100%';
                        clearInterval(card.intervalId);
                        card.pauseResumeBtns.classList.add('hidden');
                        card.endBtns.classList.remove('hidden');
                        card.startResetBtns.classList.add('hidden');
                        card.classList.add('shaking');
                        if (card.alarmSound) {
                            try { card.alarmSound.loop = true; card.alarmSound.play(); } catch (e) { console.warn('alarm play failed', e); }
                        }
                    } else if (!isPaused) {
                        card.elapsedSeconds = Math.max(0, Math.floor(elapsedActiveTime));
                        timeLeftDisplay.textContent = formatTime(card.elapsedSeconds);
                        timeRightDisplay.textContent = formatTime(card.totalSeconds);
                        progressBar.style.width = `${(card.elapsedSeconds / (card.totalSeconds || 1)) * 100}%`;
                        clearInterval(card.intervalId);
                        card.intervalId = setInterval(card.checkTimeAndAct, 500);
                        card.startResetBtns.classList.add('hidden');
                        card.pauseResumeBtns.classList.remove('hidden');
                        card.endBtns.classList.add('hidden');
                        card.querySelector('.pause-btn').classList.remove('hidden');
                        card.querySelector('.resume-btn').classList.add('hidden');
                    } else {
                        card.elapsedSeconds = Math.max(0, Math.floor(elapsedActiveTime));
                        timeLeftDisplay.textContent = formatTime(card.elapsedSeconds);
                        timeRightDisplay.textContent = formatTime(card.totalSeconds);
                        progressBar.style.width = `${(card.elapsedSeconds / (card.totalSeconds || 1)) * 100}%`;
                    }
                }
            })();

            timeSelect.addEventListener('change', (event) => {
                const priceDisplay = card.querySelector('.price-display');
                const selectedOption = timeSelect.options[timeSelect.selectedIndex];
                const selectedPrice = selectedOption.dataset.price;
                const overridePrice = card.dataset.overridePrice ? card.dataset.overridePrice : null;
                if (overridePrice) {
                    priceDisplay.textContent = `C$ ${overridePrice} (override)`;
                } else {
                    priceDisplay.textContent = `C$ ${selectedPrice || '0'}`;
                }
            });

            startBtn.addEventListener('click', () => {
                if (timeSelect.selectedIndex <= 0) {
                    alert("Por favor, elige una duración antes de iniciar.");
                    return;
                }
                
                const selectedOption = timeSelect.options[timeSelect.selectedIndex];
                let selectedValue = selectedOption.value;
                let selectedPrice = parseFloat(selectedOption.dataset.price);
                if (selectedOption.dataset.custom === 'true') {
                    const minutesInput = prompt('¿Cuántos minutos deseas registrar?', '60');
                    if (minutesInput === null) return;
                    const priceInput = prompt('¿Qué precio deseas cobrar? Puedes poner 0 para gratis.', '0');
                    if (priceInput === null) return;
                    const minutes = Number(minutesInput);
                    const customPrice = Number(priceInput);
                    if (!Number.isFinite(minutes) || minutes <= 0 || !Number.isFinite(customPrice) || customPrice < 0) {
                        alert('Ingresa minutos mayores que 0 y un precio igual o mayor a 0.');
                        return;
                    }
                    selectedValue = Math.round(minutes * 60);
                    selectedPrice = customPrice;
                    delete card.dataset.overridePrice;
                    card.querySelector('.price-display').textContent = `C$ ${customPrice}`;
                }
                const overridePrice = card.dataset.overridePrice ? parseFloat(card.dataset.overridePrice) : null;
                const priceToUse = (overridePrice !== null && !isNaN(overridePrice)) ? overridePrice : selectedPrice;

                card.startNewSession(selectedValue, priceToUse);
            });

            pauseBtn.addEventListener('click', () => {
                clearInterval(card.intervalId);
                card.pauseStartTime = new Date().getTime();
                card.updateEndTimeDisplay();
                pauseBtn.classList.add('hidden');
                resumeBtn.classList.remove('hidden');
            });

            resumeBtn.addEventListener('click', () => {
                if (card.pauseStartTime) {
                    const pauseDuration = new Date().getTime() - card.pauseStartTime;
                    card.totalPausedTime += pauseDuration;
                    card.pauseStartTime = null;
                }
                
                card.updateEndTimeDisplay();
                card.checkTimeAndAct(); 
                clearInterval(card.intervalId);
                card.intervalId = setInterval(card.checkTimeAndAct, 500);

                pauseBtn.classList.remove('hidden');
                resumeBtn.classList.add('hidden');
            });
            
            endSessionBtn.addEventListener('click', () => {
                const selectedOption = timeSelect.options[timeSelect.selectedIndex];
                const selectedPrice = parseFloat(selectedOption.dataset.price);
                const baseComment = 'Finalizado';
                const fullComment = card.transferComment ? `${baseComment}; ${card.transferComment}` : baseComment;
                const overridePrice = card.dataset.overridePrice ? parseFloat(card.dataset.overridePrice) : null;
                const priceToSave = (overridePrice && !isNaN(overridePrice)) ? overridePrice : selectedPrice;
                const overrideForSave = card.dataset.overridePrice ? parseFloat(card.dataset.overridePrice) : null;
                saveSessionData(
                    card.dataset.consoleType,
                    card.dataset.consoleNumber,
                    card.totalSeconds,
                    priceToSave,
                    card.sessionStartTime,
                    'detener',
                    fullComment,
                    overrideForSave
                );
                addEarnings(priceToSave);
                card.resetCard();
            });
            
            endEarlyBtn.addEventListener('click', () => {
                const selectedOption = timeSelect.options[timeSelect.selectedIndex];
                const selectedPrice = parseFloat(selectedOption.dataset.price);
                const baseComment = 'Se detuvo antes de tiempo';
                const fullComment = card.transferComment ? `${baseComment}; ${card.transferComment}` : baseComment;
                const overridePrice = card.dataset.overridePrice ? parseFloat(card.dataset.overridePrice) : null;
                const priceToSave = (overridePrice && !isNaN(overridePrice)) ? overridePrice : selectedPrice;
                const overrideForSave = card.dataset.overridePrice ? parseFloat(card.dataset.overridePrice) : null;
                saveSessionData(
                    card.dataset.consoleType,
                    card.dataset.consoleNumber,
                    card.elapsedSeconds,
                    priceToSave,
                    card.sessionStartTime,
                    'detener',
                    fullComment,
                    overrideForSave
                );
                addEarnings(priceToSave);
                card.resetCard();
            });

            resetBtn.addEventListener('click', () => {
                card.resetCard();
            });

            addTimeBtn.addEventListener('click', () => {
                const selectedOption = timeSelect.options[timeSelect.selectedIndex];
                if (selectedOption && selectedOption.value) {
                    const selectedValue = parseInt(selectedOption.value);
                    const selectedPrice = parseFloat(selectedOption.dataset.price);

                    const overridePrice = card.dataset.overridePrice ? parseFloat(card.dataset.overridePrice) : null;
                    const priceToSave = (overridePrice && !isNaN(overridePrice)) ? overridePrice : selectedPrice;
                    const overrideForSave = card.dataset.overridePrice ? parseFloat(card.dataset.overridePrice) : null;
                    saveSessionData(card.dataset.consoleType, card.dataset.consoleNumber, card.elapsedSeconds, card.currentSessionEarnings, card.sessionStartTime, undefined, undefined, overrideForSave);
                    addEarnings(card.currentSessionEarnings);
                    card.startNewSession(selectedValue, priceToSave);

                } else {
                    alert("Por favor, elige una duración antes de añadir más tiempo.");
                }
            });
            
            const calculateBtn = card.querySelector('.calculate-time-btn');
            if (calculateBtn) {
                calculateBtn.addEventListener('click', () => {
                    if (card.totalSeconds > 0) {
                        alert('El cálculo se hace antes de iniciar la sesión.');
                        return;
                    }
                    const amountInput = prompt('¿Cuántos córdobas tiene el cliente? (Tarifa actual: C$1 = 1 minuto)', '');
                    if (amountInput === null) return;
                    const amount = Number(amountInput);
                    if (!Number.isFinite(amount) || amount < 0) {
                        alert('Ingresa un monto igual o mayor a 0.');
                        return;
                    }
                    const minutes = Math.floor(amount);
                    const hours = Math.floor(minutes / 60);
                    const remaining = minutes % 60;
                    const readable = hours > 0
                        ? `${hours} hora${hours === 1 ? '' : 's'}${remaining ? ` y ${remaining} minuto${remaining === 1 ? '' : 's'}` : ''}`
                        : `${minutes} minuto${minutes === 1 ? '' : 's'}`;
                    if (!confirm(`C$ ${amount} equivalen a ${readable}. ¿Quieres usar ese tiempo en esta ficha?`)) return;
                    let custom = timeSelect.querySelector('option[data-owner-custom="true"]');
                    if (!custom) {
                        custom = document.createElement('option');
                        custom.dataset.ownerCustom = 'true';
                        timeSelect.appendChild(custom);
                    }
                    custom.value = String(minutes * 60);
                    custom.dataset.price = String(amount);
                    custom.textContent = `Personalizado: ${readable} — C$ ${amount}`;
                    timeSelect.value = custom.value;
                    delete card.dataset.overridePrice;
                    card.querySelector('.price-display').textContent = `C$ ${amount}`;
                });
            }
            const modifyBtn = card.querySelector('.modify-price-btn');
            if (modifyBtn) {
                modifyBtn.addEventListener('click', () => {
                    if (card.totalSeconds > 0) {
                        alert('Este ajuste se hace antes de iniciar la sesión.');
                        return;
                    }
                    const amountInput = prompt('Monto o precio del cliente (C$). Tarifa actual: C$1 = 1 minuto:', '0');
                    if (amountInput === null) return;
                    const price = Number(String(amountInput).replace(',', '.').trim());
                    if (!Number.isFinite(price) || price < 0) {
                        alert('Ingresa un precio igual o mayor a 0.');
                        return;
                    }
                    const suggestedMinutes = Math.floor(price);
                    const hours = Math.floor(suggestedMinutes / 60);
                    const remaining = suggestedMinutes % 60;
                    const readable = hours > 0 ? `${hours} hora${hours === 1 ? '' : 's'}${remaining ? ` y ${remaining} minuto${remaining === 1 ? '' : 's'}` : ''}` : `${suggestedMinutes} minuto${suggestedMinutes === 1 ? '' : 's'}`;
                    const minutesInput = prompt(`C$ ${price} equivalen a ${readable}. Ajusta el tiempo final en minutos si lo necesitas:`, suggestedMinutes);
                    if (minutesInput === null) return;
                    const minutes = Number(String(minutesInput).replace(',', '.').trim());
                    if (!Number.isFinite(minutes) || minutes <= 0) {
                        alert('Ingresa minutos mayores que 0.');
                        return;
                    }
                    let custom = timeSelect.querySelector('option[data-owner-custom="true"]');
                    if (!custom) {
                        custom = document.createElement('option');
                        custom.dataset.ownerCustom = 'true';
                        timeSelect.appendChild(custom);
                    }
                    custom.value = String(Math.round(minutes * 60));
                    custom.dataset.price = String(price);
                    custom.textContent = `Personalizado: ${minutes} min — C$ ${price}`;
                    timeSelect.value = custom.value;
                    delete card.dataset.overridePrice;
                    card.querySelector('.price-display').textContent = `C$ ${price}`;
                });
            }
            
            changeConsoleBtn.addEventListener('click', () => {
                if (transferMode) return;
                
                clearInterval(card.intervalId);
                card.elapsedAtPause = card.elapsedSeconds;
                card.pauseStartTime = new Date().getTime();
                
                transferMode = true;
                sourceCard = card;
                
                sourceCard.pauseResumeBtns.classList.add('hidden');
                sourceCard.transferBtns.classList.remove('hidden');
                
                sourceCard.classList.add('transfer-mode');
                transferMessage.style.display = 'block';
                
                document.querySelectorAll('.console-card').forEach(c => {
                    if (c !== sourceCard && c.totalSeconds === 0) {
                        c.classList.add('target-mode');
                        c.addEventListener('click', handleTransferClick);
                    } else {
                        c.classList.add('disabled-card');
                    }
                });
            });

            cancelTransferBtn.addEventListener('click', () => {
                if (!sourceCard) return;

                sourceCard.classList.remove('transfer-mode');
                sourceCard.pauseResumeBtns.classList.remove('hidden');
                sourceCard.transferBtns.classList.add('hidden');
                
                if (sourceCard.totalSeconds > 0) {
                    const now = new Date().getTime();
                    const pauseDuration = now - sourceCard.pauseStartTime;
                    sourceCard.totalPausedTime += pauseDuration;
                    sourceCard.pauseStartTime = null;

                    sourceCard.sessionStartTime = now - (sourceCard.elapsedSeconds * 1000) - sourceCard.totalPausedTime;
                    sourceCard.updateEndTimeDisplay();
                    clearInterval(sourceCard.intervalId);
                    sourceCard.intervalId = setInterval(sourceCard.checkTimeAndAct, 500);
                }
                
                transferMode = false;
                transferMessage.style.display = 'none';

                document.querySelectorAll('.console-card').forEach(c => {
                    c.classList.remove('disabled-card', 'target-mode', 'transfer-mode');
                    c.removeEventListener('click', handleTransferClick);
                });
                sourceCard = null;
            });
        }
        
        function saveSessionData(consoleType, consoleNumber, durationSeconds, totalEarnings, startTime) {
            const currentUser = window.currentUser || null;
            let action = arguments.length > 5 ? arguments[5] : undefined;
            let commentArg = arguments.length > 6 ? arguments[6] : undefined;
            let overridePriceArg = arguments.length > 7 ? arguments[7] : undefined;
            let fromConsole = arguments.length > 8 ? arguments[8] : undefined;

            let comment = commentArg || '';
            if (!comment) {
                if (action === 'detener') comment = 'Se detuvo antes de tiempo';
            }

            const newSession = {
                clientName: 'Cliente',
                consoleType,
                consoleNumber: Number(consoleNumber),
                startDate: getFechaHoraNicaragua(new Date(startTime)),
                endDate: getFechaHoraNicaragua(),
                totalPrice: Number(totalEarnings) || 0,
                durationSeconds: Number(durationSeconds) || 0,
                action: action || '',
                fromConsole: fromConsole || undefined,
                comment: comment || ''
            };
            // Si se pasó un overridePrice explícito, incluirlo para audit
            if (typeof overridePriceArg !== 'undefined' && overridePriceArg !== null) {
                const parsed = Number(overridePriceArg);
                if (!isNaN(parsed)) {
                    newSession.overridePrice = parsed;
                    newSession.override = true;
                }
            }
            // Adjuntar empleado (si está en el cliente)
            if (currentUser && currentUser.username) newSession.employee = currentUser.username;
        function getFechaNicaragua() {
            const ahora = new Date();
            const nica = ahora.toLocaleString('sv-SE', { timeZone: 'America/Managua' });
            return nica.split(' ')[0];
        }
        function getFechaHoraNicaragua(dateObj) {
            const d = dateObj ? new Date(dateObj) : new Date();
            return d.toLocaleString('sv-SE', { timeZone: 'America/Managua' }).replace(' ', 'T');
        }
            fetch('https://zonagamer-backend.onrender.com/accion', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(newSession),
                credentials: 'include'
            }).then(r => r.json()).then(resp => {
                if (!resp.ok) {
                    console.error('No se pudo guardar la acción en el backend');
                }
            }).catch(err => {
                console.error('Error enviando acción al backend:', err);
            });
        }

        function recordWorkDay() {
            const currentUser = window.currentUser || null;
            if (currentUser && typeof currentUser.role === 'string' && currentUser.role.trim().toLowerCase() === 'trabajador') {
                const today = new Date().toISOString().slice(0, 10);
                let workDaysData = {};
                if (!workDaysData[currentUser.username]) {
                    workDaysData[currentUser.username] = [];
                }
                if (!workDaysData[currentUser.username].includes(today)) {
                    workDaysData[currentUser.username].push(today);
                    console.log('[recordWorkDay] Día registrado:', today, 'para usuario:', currentUser.username);
                } else {
                    console.log('[recordWorkDay] Día ya registrado:', today, 'para usuario:', currentUser.username);
                }
                console.log('[recordWorkDay] workDaysData:', workDaysData);
            } else if (currentUser) {
                console.log('[recordWorkDay] Usuario con rol no trabajador:', currentUser.username, currentUser.role);
            } else {
                console.log('[recordWorkDay] No hay currentUser en sesión');
            }
        }
        


        usernameDisplay.addEventListener('click', () => {
            sidebar.classList.toggle('collapsed');
        });
        

        logoutBtn.addEventListener('click', async () => {
            await fetch('https://zonagamer-backend.onrender.com/session', { method: 'DELETE', credentials: 'include' });
            window.location.href = 'index.html';
        });
        
        if (typeof btnReporteGeneral !== 'undefined' && btnReporteGeneral) {
            btnReporteGeneral.addEventListener('click', () => {
                alert('Funcionalidad de Reporte General próximamente.');
            });
        }
        if (typeof btnDescargarReporte !== 'undefined' && btnDescargarReporte) {
            btnDescargarReporte.addEventListener('click', () => {
                alert('Funcionalidad de Descargar Reporte próximamente.');
            });
        }
        if (typeof btnAñadirConsola !== 'undefined' && btnAñadirConsola) {
            btnAñadirConsola.addEventListener('click', () => {
                alert('Funcionalidad de Añadir Consola próximamente.');
            });
        }
        if (typeof btnAñadirPrecio !== 'undefined' && btnAñadirPrecio) {
            btnAñadirPrecio.addEventListener('click', () => {
                alert('Funcionalidad de Añadir Precio próximamente.');
            });
        }
    document.addEventListener('DOMContentLoaded', async () => {
        // Esperar la comprobación de sesión antes de dibujar las fichas. Sin esto,
        // la opción de dueña podía no aparecer al cargar más rápido que la sesión.
        for (let attempts = 0; !window.currentUser && attempts < 100; attempts++) {
            await new Promise(resolve => setTimeout(resolve, 50));
        }
        await fetchConsoles();
        await fetchPrices();
        await fetchProducts();
        loadAndRenderConsoles();
        renderProductsSidebar();
        const sellProductBtn = document.getElementById('sellProductBtn');
        const cancelProductBtn = document.getElementById('cancelProductBtn');
        const productSelect = document.getElementById('productSelect');
        const productQuantity = document.getElementById('productQuantity');
        if (sellProductBtn) sellProductBtn.addEventListener('click', sellSelectedProduct);
        if (cancelProductBtn && productSelect) cancelProductBtn.addEventListener('click', () => {
            productSelect.value = '';
            updateProductImagePreview(null);
            if (productQuantity) productQuantity.value = '1';
        });
    try { loadEarnings().catch(() => {}); } catch {}
    });
    </script>
</body>
